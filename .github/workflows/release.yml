# 当前版本适用多 flavor 项目
# 构建 github 渠道的 Release APK
# 使用原始的 APK 文件名称

name: Release

# 触发条件：推送 v 开头的 tag（如 v1.0.0、v2.1.3）时触发构建并发布 Release
on:
  push:
    tags:
      - v*

# 并发控制：同一 tag 不会重复构建，不同 tag 互不影响
# group 绑定 github.ref（tag 名），确保每个 tag 独立排队
# cancel-in-progress: false 不取消已在进行的构建，避免签名/上传中断
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 指定环境，对应仓库 Settings 的 Environment secrets 中的 Environment 名称
    # 环境隔离：签名密钥等敏感信息仅在此环境可用，且可配置 required reviewers / deployment branches
    # 若使用的是 Repository secrets 则不需要声明 environment
    environment: zjmok.jks
    permissions:
      # softprops/action-gh-release 创建 Release / 上传资源需要写入仓库内容的权限
      contents: write

    steps:
      - uses: actions/checkout@v4

      # JDK 17 + Gradle 缓存（内置 cache: gradle，等同于手动 actions/cach，加速后续构建（缓存 ~/.gradle/caches））
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets#storing-base64-binary-blobs-as-secrets
      # 从 Repository secrets 解码 Base64 编码的签名文件到 release.jks
      # 所需 secrets: RELEASE_STORE_FILE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      - name: Decode signing keystore
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        run: |
          echo "$RELEASE_STORE_FILE_BASE64" | base64 -d > release.jks

      # 通过环境变量将签名信息注入 Gradle（见 app/build.gradle 中的 signingConfigs）
      - name: Assemble Release APK
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # 构建 Github 渠道的 Release 变体（applicationId 加 .github 后缀）
        # 产物路径：app/build/outputs/apk/github/release/
        run: ./gradlew assembleGithubRelease

      # 创建 GitHub Release 并附加 APK（自动基于 PR/commit 生成 changelog）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动生成 Release Notes（基于上一个 tag 到当前 tag 之间的 PR / commit）
          generate_release_notes: true
          # 上传所有 Release APK（Github 渠道可能产出多个 ABI 分包）
          files: app/build/outputs/apk/github/release/*.apk
