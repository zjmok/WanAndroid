android {
    sourceSets {
        main {
            // `+=` 追加目录，`=` 会覆盖默认目录
            res.srcDirs += [
                    // 多语言
                    "src/main/res-language",

                    // 拆分存放各模块的资源
                    "src/main/res-splash",
                    "src/main/res-setting",
            ]

