        jvmToolchain(17) // 最低版本与 Gradle 版本有关
    }

    buildFeatures {
        buildConfig = true
//        aidl true
        viewBinding true
        compose = true
    }

    packagingOptions { // 这个块定义了打包相关的配置
        // 指定在构建 APK 或 AAR 时要排除的文件或路径
        // `AL2.0` 和 `LGPL2.1` 通常是许可证文件，可能在某些情况下不需要打包进最终的 APK 或 AAR 中
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

