            buildConfigField "String", "APP_CHANNEL", "\"${name}\""
        }
        github {
            // github
            dimension "channel"
            applicationIdSuffix ".github"
            versionNameSuffix ".github"
            manifestPlaceholders = [app_channel: "\"${name}\""]
            buildConfigField "String", "APP_CHANNEL", "\"${name}\""
        }
//        floatButton {
//            dimension "debug"
//        }
        // 国内 aab 支持有限
//        arm32 {
//            dimension "abi"
//            ndk {
//                //noinspection ChromeOsAbiSupport
//                abiFilters "armeabi-v7a"
//            }
//        }
//        arm64 {
//            dimension "abi"
//            ndk {
//                //noinspection ChromeOsAbiSupport
//                abiFilters "arm64-v8a"
//            }
//        }
//        arm {
//            isDefault = true
//            dimension "abi"
//            ndk {
//                //noinspection ChromeOsAbiSupport
//                abiFilters "armeabi-v7a", "arm64-v8a"
//            }
//        }
//        x86 {
//            dimension "abi"
//            ndk {
//                abiFilters "x86_64"
//            }
//        }
    }

    // 构建类型 buildTypes
    // https://developer.android.com/build/build-variants
    buildTypes {
        debug {
            isDefault = true
            versionNameSuffix ".${gitCommitId}"
            debuggable true // 可调试
            minifyEnabled false // 代码压缩 (R8/ProGuard)
            shrinkResources false // 资源压缩 (shrinkResources)
//            signingConfig signingConfigs.debugAsRelease
            signingConfig signingConfigs.release
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
//            signingConfig signingConfigs.debugAsRelease
            signingConfig signingConfigs.release
        }
    }

    // variant 变体，由 flavorDimensions + productFlavors + buildTypes 组合而成
    // 配置优先级 main < flavorDimensions < productFlavors < buildTypes < variant，因为后者会覆盖前者
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavorType = variant.productFlavors.collect {
                it.name.capitalize()
            }.join() + variant.buildType.name.capitalize() // 格式 GithubRelease
            def name = ("WanAndroid" +
                    "_${variant.versionName}" +
//                    "_${variant.versionCode}" +
//                    "_${variant.buildType.name}" +
//                    "_${flavorType}" +
//                    "_${gitCommitId}" +
//                    "_${time.time}" +
                    ".apk")
            println("${flavorType} outputFileName = ${name}")
            outputFileName = name
        }
    }

    // https://developer.android.com/build/jdks
    compileOptions {
        encoding "UTF-8"
        // 代码 的 java 编译版本
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
