def time = new Date()

// gradle configuration-cache 不兼容 executeCmd, 替换为 providers
//def gitCommitCount = executeCmd("git rev-list --count HEAD")?.toInteger() ?: 0
// gradle configuration-cache 要求不要直接在脚本里执行命令，要使用 Gradle 提供的 ValueSource (或简写为 providers)。这样 Gradle 会知道这个值是来自外部命令的，并在命令输出变化时自动刷新缓存
def gitCommitCount = providers.exec {
    commandLine "git", "rev-list", "--count", "HEAD"
}.standardOutput.asText.map { it.trim().toInteger() }.getOrElse(0)

// gradle configuration-cache 不兼容 executeCmd, 替换为 providers
//def gitCommitId = executeCmd("git rev-parse --short HEAD") ?: "v0.0.0" //
def gitCommitId = providers.exec {
    commandLine "git", "rev-parse", "--short", "HEAD"
}.standardOutput.asText.map { it.trim() }.getOrElse("v0.0.0")

// gradle configuration-cache 不兼容 executeCmd, 替换为 providers
//def gitTag = executeCmd("git tag --points-at HEAD").split("\n")
def gitTag = providers.exec {
    commandLine "git", "tag", "--points-at", "HEAD"
}.standardOutput.asText.map { it.trim().split("\n") }.getOrElse([])

// 版本号版本名称管理方案：
// 方案1，git 管理之 gitLastTag。
// 无需审核时，可使用 release 分支合并版本分支，在版本对应节点打上 tag，再进行打包
// gradle configuration-cache executeCmd, 替换为 providers
//def gitLastTag = executeCmd("git describe --tags --always").split("-").first() ?: "v0.0.0"
def gitLastTag = providers.exec {
    commandLine "git", "describe", "--tags", "--always"
}.standardOutput.asText.map { it.trim().split("-").first() ?: "v0.0.0" }.getOrElse("v0.0.0")

// 方案2，git 管理之 gitBranch。
// 需要审核时，可使用版本分支进行打包，审核通过发行后可合并到主分支
// gradle configuration-cache executeCmd, 替换为 providers
//def gitBranch = executeCmd("git branch --show-current") ?: "alpha"
def gitBranch = providers.exec {
    commandLine "git", "branch", "--show-current"
}.standardOutput.asText.map { it.trim().isEmpty() ? "alpha" : it.trim() }.getOrElse("alpha")

// 方案3，常规管理，代码硬编码。

static def executeCmd(String cmd) {
    try {
        def process = cmd.execute()
        process.waitFor()
        def result = process.text.trim()
        return result
    } catch (e) {
        println(e)
        return null
    }
}

android {
    namespace "org.example.wan.android"
    // 确定编译应用时，项目代码可以使用哪些 API。不影响应用运行时的行为，只影响编译时可以访问到哪些类和方法
    compileSdk 36
//    compileSdkExtension 19 // 36.0-ext19

    defaultConfig {
        applicationId "org.example.wan.android"
        minSdk 21
        // 指定应用在运行时目标的 Android 版本。不影响可以使用的 API，而是影响应用在运行时的行为
        targetSdk 36

        versionCode gitCommitCount
//        versionCode 1

//        versionName gitLastTag
        versionName "${gitBranch}.${gitCommitCount}"
//        versionName "1.0.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        resConfigs "en", "zh", "zh-rHK", "zh-rTW"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        buildConfigField "String", "COMMIT_ID", "\"${gitCommitId}\""
        buildConfigField "String", "BUILD_TIME", "\"${time.time}\""
        buildConfigField "String", "OS_ARCH", "\"${System.properties['os.arch']}\""
        // On Java 11 (11.0.15) and Java 17 (17.0.3), System.getProperty("os.name") returns Windows 11, but "os.version" still reports 10.0
        buildConfigField "String", "OS_NAME", "\"${System.properties['os.name']}\""
        buildConfigField "String", "USER_NAME", "\"${System.properties['user.name']}\""
        buildConfigField "String", "GRADLE_VERSION", "\"${gradle.gradleVersion}\""
        buildConfigField "String", "KOTLIN_VERSION", "\"${kotlin_version}\""
        buildConfigField "String", "JVM_TOOLCHAIN", "\"17\""
        buildConfigField "String", "JVM_TARGET", "\"1.8\"" // 对应 compileOptions kotlinOptions
        buildConfigField "String", "COMPOSE_VERSION", "\"${composeBoMVersion}\""

        vectorDrawables {
            useSupportLibrary true
        }
    }

//    ndkVersion project.properties.ndkVersion

    signingConfigs {
        def releasePropsFile = rootProject.file("release.jks.properties")
        def releaseProps = null
        if (releasePropsFile.exists()) {
            releaseProps = new Properties()
            releaseProps.load(releasePropsFile.newDataInputStream())
        }
        def env = { String key -> System.getenv(key) }
        if (releaseProps != null || env("RELEASE_STORE_FILE") != null) {
            // https://developer.android.com/studio/publish/app-signing#secure_key
            release {
                storeFile rootProject.file(releaseProps?.getProperty("storeFile") ?: "release.jks")
                storePassword releaseProps?.getProperty("storePassword") ?: env("RELEASE_STORE_PASSWORD") ?: ""
                keyAlias releaseProps?.getProperty("keyAlias") ?: env("RELEASE_KEY_ALIAS") ?: ""
                keyPassword releaseProps?.getProperty("keyPassword") ?: env("RELEASE_KEY_PASSWORD") ?: ""
            }
        }
        // Android 自动生成的 debug.keystore 签名，或直接用 debug
        debugAsRelease {
            storeFile file("${System.getenv("ANDROID_SDK_HOME") ?: System.getProperty("user.home")}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    // flavorDimensions（维度） + productFlavors（风味） + buildTypes（构建类型），最终组合生成变体
    // https://developer.android.com/build/build-variants

    // 定义 维度
    flavorDimensions = ["channel"/*, "debug"*//*, "abi"*/]

    // 定义 风味
    // 每个风味都需要指定一个维度名称，不同风味和维度可以组合，再分别组合 buildTypes，就是最终组合
    productFlavors {
        // app 需保留，否则会报错：The SourceSet 'app' is not recognized by the Android Gradle Plugin. Perhaps you misspelled something?
        app {
            // official
            isDefault = true // variant 组合的默认 flavor
            dimension "channel"
            manifestPlaceholders = [app_channel: "\"${name}\""]
            buildConfigField "String", "APP_CHANNEL", "\"${name}\""
        }
        github {
            // github
            dimension "channel"
            applicationIdSuffix ".github"
            versionNameSuffix "_github"
            manifestPlaceholders = [app_channel: "\"${name}\""]
            buildConfigField "String", "APP_CHANNEL", "\"${name}\""
        }
//        floatButton {
//            dimension "debug"
//        }
        // 国内 aab 支持有限
//        arm32 {
//            dimension "abi"
//            ndk {
//                //noinspection ChromeOsAbiSupport
//                abiFilters "armeabi-v7a"
//            }
//        }
//        arm64 {
//            dimension "abi"
//            ndk {
//                //noinspection ChromeOsAbiSupport
//                abiFilters "arm64-v8a"
//            }
//        }
//        arm {
//            isDefault = true
//            dimension "abi"
//            ndk {
//                //noinspection ChromeOsAbiSupport
//                abiFilters "armeabi-v7a", "arm64-v8a"
//            }
//        }
//        x86 {
//            dimension "abi"
//            ndk {
//                abiFilters "x86_64"
//            }
//        }
    }

    // 定义 构建类型
    buildTypes {
        debug {
            isDefault = true // variant 组合的默认 buildType
            versionNameSuffix "_${gitCommitId}"
            debuggable true // 可调试
            minifyEnabled false // 代码压缩 (R8/ProGuard)
            shrinkResources false // 资源压缩 (shrinkResources)
//            signingConfig signingConfigs.debugAsRelease
//            signingConfig signingConfigs.release
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.getByName("debug")
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
//            signingConfig signingConfigs.debugAsRelease
//            signingConfig signingConfigs.release
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.getByName("debug")
        }
    }

    // variant 变体，由 flavorDimensions + productFlavors + buildTypes 组合而成
    // 配置优先级 main < flavorDimensions < productFlavors < buildTypes < variant
    // 后者会覆盖前者
    // 不同的 source set 中有相同代码资源也会如此优先级覆盖，类似 debugImplementation 与 main 的有相同代码资源也是如此
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavorType = variant.productFlavors.collect {
                it.name.capitalize()
            }.join() + variant.buildType.name.capitalize() // 格式 GithubRelease
            def name = ("WanAndroid" +
                    "_${variant.versionName}" +
//                    "_${variant.versionCode}" +
//                    "_${variant.buildType.name}" +
//                    "_${flavorType}" +
//                    "_${gitCommitId}" +
//                    "_${time.time}" +
                    ".apk")
            println("${flavorType} outputFileName = ${name}")
            outputFileName = name
        }
    }

    // https://developer.android.com/build/jdks
    // 编译器版本：互相独立，Java 编译器版本由 Gradle 版本决定，Kotlin 编译器版本就是 Kotlin 版本（例如 Kotlin 1.9.25）
    // 编译环境版本：建议统一，避免工具链不一致导致的奇怪问题
    // 字节码的版本：必须统一
    // 编译：用 Kotlin 1.9.25 编译器 + JDK 17 环境 → 生成 Java 8 字节码
    // 输出 Java 字节码 版本 👇
    // Java 编译器 (javac) 选项，AGP 提供
    compileOptions {
        encoding "UTF-8"
        // Java 源码语法，兼容版本
        sourceCompatibility JavaVersion.VERSION_1_8
        // 输出的 java 字节码 目标版本，兼容版本
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Kotlin 编译器 (kotlinc) 选项，KGP 提供
    kotlinOptions {
        // 输出 Kotlin 字节码 目标版本，兼容版本
        jvmTarget = "1.8"
    }
    // 编译环境 JDK 版本 👇
    // Gradle 7 require JDK 11+
    // Gradle 8 require JDK 17+
    // 编译环境 Java
    java {
        // 工具链，使用的 JDK 版本
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    // 编译环境 Kotlin
    kotlin {
        // 工具链，使用的 JDK 版本
        jvmToolchain(17)
    }

    buildFeatures {
        buildConfig = true
//        aidl true
        viewBinding true
        compose = true
    }

    packagingOptions { // 这个块定义了打包相关的配置
        // 指定在构建 APK 或 AAR 时要排除的文件或路径
        // `AL2.0` 和 `LGPL2.1` 通常是许可证文件，可能在某些情况下不需要打包进最终的 APK 或 AAR 中
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

/*
    lint {
        // https://developer.android.google.cn/studio/write/lint?hl=zh-cn#snapshot
        // Lint 检测: `./gradlew lint`，可加变体: `./gradlew lintRelease`
        // baseline 忽略已有的 Lint 问题，Lint 只会报告自上次生成基准文件之后新增的
        // 如果要创建新基准，请手动删除该文件并再次运行 lint
        baseline = file("lint-baseline.xml")
        ignoreWarnings = true // true 忽略警告
        abortOnError false // false 遇到错误不停止
        textReport true // true 输出lint报告
    }
*/
}

